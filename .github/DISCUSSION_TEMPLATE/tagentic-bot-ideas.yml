# Discussion form for the "Tagentic bot ideas" category (Tagentic telegram bot community section).
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Suggest a feature or an improvement for the Tagentic1 Telegram bot (beta). Ideas are welcome, but they are not promises: the maintainer decides what gets built and when, and can take several days to reply.

        **Never post your bot token, chat IDs or personal data.**
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to do that the bot does not do well today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should the bot behave? Example messages or commands help.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode does it affect?
      options:
        - Owner chat
        - Public chats and groups
        - Both
        - Not sure
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste my bot token, chat IDs or other personal data in this post.
          required: true
