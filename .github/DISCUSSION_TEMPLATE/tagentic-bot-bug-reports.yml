# Discussion form for the "Tagentic bot bug reports" category (Tagentic telegram bot community section).
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with the Tagentic1 Telegram bot (beta).

        **Never post your bot token, chat IDs, phone number or other personal data.** If you already did, delete it from the post and revoke the token in @BotFather (`/revoke`).

        Security problems: do not post them here. Report them privately at https://github.com/klanarongz2009-sketch/ter-ai/security/advisories/new

        Setup guide: [docs/TAGENTIC_TELEGRAM.md](https://github.com/klanarongz2009-sketch/ter-ai/blob/main/docs/TAGENTIC_TELEGRAM.md). The automated support bot Teemate may reply first; it is not the maintainer, and the maintainer can take several days to answer.
  - type: input
    id: version
    attributes:
      label: TER-AI version
      description: Output of `terai --version`, or the release tag you installed (for example v0.18.0-rc1).
      placeholder: v0.18.0-rc1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      description: For example Ubuntu 24.04, Python 3.12. Say if you run it on a GPU or CPU only.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The full command, for example `terai tagentic telegram`. Remove the token if it is in the command.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the bot or the terminal did. Say if it happened in an owner chat, a public chat or a group.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or log
      description: Paste the error or the relevant log lines. Remove the bot token and chat IDs first.
      render: text
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the bot with ...
        2. Send ...
        3. See ...
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste my bot token, chat IDs or other personal data in this post.
          required: true
        - label: This is not a security vulnerability (those go to a private security advisory).
          required: true
