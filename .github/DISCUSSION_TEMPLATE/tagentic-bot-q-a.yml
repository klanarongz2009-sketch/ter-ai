# Discussion form for the "Tagentic bot Q&A" category (Tagentic telegram bot community section).
title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Ask how to install, set up or use the Tagentic1 Telegram bot (beta). When a reply solves your question, please mark it as the answer.

        Check the [setup guide](https://github.com/klanarongz2009-sketch/ter-ai/blob/main/docs/TAGENTIC_TELEGRAM.md) first; its Troubleshooting part covers common problems.

        **Never post your bot token, chat IDs or personal data.** The automated support bot Teemate may reply first; it is not the maintainer and can be wrong.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What do you want to do, and what is unclear?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you already tried
      description: Commands you ran, settings you changed, parts of the guide you followed. Remove the token and chat IDs.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: TER-AI version
      description: Output of `terai --version`, or the release tag you installed.
      placeholder: v0.18.0-rc1
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste my bot token, chat IDs or other personal data in this post.
          required: true
