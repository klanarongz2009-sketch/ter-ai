[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terai-router"
version = "0.18.3"
description = "Offline Thai intent router that tolerates typos. Small, CPU-only, no dependencies. Made with Sesame."
readme = "README.md"
# Aggregate license expression for files included in the distribution; per-file scope is documented in README.md and DATA_LICENSE.
license = "MIT AND CC-BY-SA-4.0 AND GPL-3.0-only AND LicenseRef-TER-AI-1.0"
license-files = [
    "LICENSE",
    "DATA_LICENSE",
    "NOTICE",
    "LICENSE-TER-AI.md",
    "LICENSE-TER-AI-1.0.md",
    "src/terai_router/muml_wa/data/LICENSE-GPL-3.0.txt",
    "src/terai_router/tagentic/data/skills/ai-memory-continuity/LICENSE",
]
authors = [{ name = "Klanarong Tammakatuek (klanarongz2009-sketch)" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["thai", "nlp", "intent", "intent-classification", "typo", "offline", "chatbot", "iot", "tts", "text-to-speech", "music", "text-to-music"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Thai",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/klanarongz2009-sketch/ter-ai"
Repository = "https://github.com/klanarongz2009-sketch/ter-ai"
Demo = "https://klanarongz2009-sketch.github.io/ter-ai/"

[project.optional-dependencies]
train = ["numpy", "scipy"]
dev = ["pytest"]
# TTH speech engines (the core install stays dependency-free).
# tth: local Wayu-Paxa-TTS-Edge (inference code Apache-2.0; weights CC-BY-NC-4.0, non-commercial, downloaded from
#      Hugging Face on first use, never shipped here) plus the edge-tts fallback. Needs Python 3.11+ (pulls torch).
# tth-edge: only the online edge-tts fallback (Microsoft service), small.
# tth-mtl: TTH-MTL, local OmniVoice by k2-fsa (code Apache-2.0; weights CC-BY-NC, non-commercial, about 3.3 GB,
#          downloaded from Hugging Face on first use, never shipped here). Multilingual. Needs Python 3.11+ (torch).
tth = [
    "wayu-tts @ git+https://github.com/wayu-research/wayu-tts-inference@07ab898d516649313926f0b843b809a962f993ad",
    "edge-tts>=6.1",
]
tth-edge = ["edge-tts>=6.1"]
tth-mtl = ["omnivoice>=0.2.1"]
sankpup = ["resvg-py>=0.1.5", "Pillow>=9"]
sankpup-gemma = ["resvg-py>=0.1.5", "Pillow>=9", "llama-cpp-python>=0.3.36"]
# llm: TERAI1 (Gemma 4, chat and vision) and TERAI1SML (Qwen2.5, text-only) through llama-cpp-python.
#      Model weights are Apache-2.0, downloaded from Hugging Face by `terai chat --setup`, never shipped here.
llm = ["llama-cpp-python>=0.3.36"]

[project.scripts]
terai = "terai_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terai_router = ["data/*.json", "sankpup/data/*.json", "muml_wa/data/*.json", "muml_wa/data/*.txt", "temmo/runtime/*.js", "term_ai/data/*.json", "tagentic/data/*.md", "tagentic/data/skills/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# MuML, Temmo and SANKPUP warn about their 2027-01-10 end of service; tests/test_deprecations.py checks it.
filterwarnings = ["ignore:.*end of service on 2027-01-10:DeprecationWarning"]
